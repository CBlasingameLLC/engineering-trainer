name: Windows installer

# Tauri cannot cross-compile a Windows binary from Linux without the MSVC CRT,
# which has to be fetched from Microsoft and is not reachable from the
# development container. So the Windows installers are built here, on real
# Windows, and published as artifacts of the run.
#
# Kept out of ci.yml deliberately: a full Rust release build is minutes rather
# than seconds, and the fast checks should stay fast.

on:
  push:
    branches: ['**']
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

jobs:
  windows:
    name: Build .msi and .exe
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      PERSONAL_PACKS_B64: ${{ secrets.PERSONAL_PACKS_B64 }}

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          # Pinned independently of the action version: the committed lockfile
          # was written by pnpm 10, and a newer major rewrites its format and
          # then fails the frozen install.
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache the Rust build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/src-tauri/target
          key: windows-cargo-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}
          restore-keys: windows-cargo-

      - run: pnpm install --frozen-lockfile

      # The bundled item banks are generated, and a Windows build that shipped a
      # stale bank would be a different application from the one CI verified.
      - name: Check the committed bank matches its generators
        run: |
          pnpm content build --variants=18
          git diff --exit-code content/packs/shared
        shell: bash

      # Optional: the learner's own packs, restored from an encrypted secret.
      #
      # `content/packs/personal/` is gitignored, so a fresh clone has nothing in
      # it and a build here would faithfully bundle zero personal items —
      # succeeding, reporting nothing, and shipping a smaller bank than whoever
      # asked for it expects. This is the one way to close that from CI, and it
      # is opt-in because it means the material lives in GitHub's secret store
      # rather than only on one machine. Route 1 in docs/PERSONAL-CONTENT.md
      # avoids the question entirely and is the one to prefer.
      #
      # `secrets` cannot be read in a step-level `if`, so it is lifted into the
      # environment first and the condition tests that.
      - name: Restore personal packs from the secret
        id: personal
        if: env.PERSONAL_PACKS_B64 != ''
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p content/packs/personal
          printf '%s' "$PERSONAL_PACKS_B64" | base64 -d | tar xzf - -C content/packs/personal
          # Names are fine to log; contents are not, so only the names.
          n=$(find content/packs/personal -maxdepth 1 -name '*.json' | tee /dev/stderr | wc -l | tr -d ' ')
          # Left unset when the archive turned out to be empty, so a secret that
          # decodes to nothing does not mislabel a perfectly ordinary artifact.
          if [ "$n" -gt 0 ]; then echo "count=$n" >> "$GITHUB_OUTPUT"; fi

      - name: Build the installers
        run: pnpm tauri build
        env:
          # Empty unless the step above ran, and an empty value is not "1", so
          # the default build is redistributable without anyone deciding so.
          VITE_ET_INCLUDE_PERSONAL: ${{ steps.personal.outputs.count && '1' || '' }}

      - name: Collect the artifacts
        shell: bash
        run: |
          mkdir -p dist-windows
          find apps/desktop/src-tauri/target -path '*bundle*' \( -name '*.msi' -o -name '*setup.exe' \) \
            -exec cp {} dist-windows/ \;
          ls -la dist-windows

      # Two names, deliberately. An artifact carrying owned material must not be
      # confused with one that can be handed to somebody else, and the file name
      # is the only label that survives being downloaded.
      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: >-
            ${{ steps.personal.outputs.count
                && 'engineering-trainer-windows-personal'
                || 'engineering-trainer-windows' }}
          path: dist-windows/*
          if-no-files-found: error
          retention-days: 30
