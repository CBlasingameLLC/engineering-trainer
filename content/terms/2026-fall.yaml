# Fall 2026 — the term in progress.
#
# This is the only document in the repository about *when* something is needed
# rather than what it is. The mastery model will happily surface the most
# decayed prerequisite in the whole degree, which is the right answer to its own
# question and the wrong thing to be shown three days before a thermodynamics
# exam. The term is what lets the app tell those apart.
#
# Weeks are counted from `startsOn`, which is the Monday of week 1, because a
# syllabus is written in weeks and a term that slips is then one line to fix
# rather than forty. Unit names must match the `unit` field on the course's
# knowledge components exactly — that string is the join, and `pack validate`
# checks it rather than trusting it, because a typo schedules nothing and looks
# identical to a quiet week.
#
# EE 4392's blocks are the real ones, read off the syllabus: classes begin
# Wednesday 19 August, so week 1 is the week of Monday 17 August, and the three
# exam dates pin weeks 6, 11 and 17. That anchor also corrects `startsOn`, which
# was a week late and therefore reported every week of the term as the one
# before it.
#
# PHYS 2335's blocks are now the real ones too, and they were worth getting:
# the estimate had the course almost exactly backwards. It actually opens with
# three weeks of fluid statics, runs thermodynamics to Exam 1, and spends its
# last third on optics — none of which the guess contained, because the guess
# was made from the course title. Class week n in that syllabus lands on term
# week n, which is a coincidence of the two courses starting together and not
# something to rely on for the next one.
#
# MATH 2358's blocks are the most directly sourced of the four: its syllabus
# carries a numbered day-by-day list of Rosen sections, so there was nothing to
# infer. Reading it also showed the graph had been written from what a discrete
# maths course usually contains rather than from what this one teaches — nine
# taught sections had no component at all, and ten components cover chapters it
# never reaches.
#
# EE 3300 is no longer an estimate, but it is not a syllabus reading either,
# because that syllabus contains no topic schedule at all — only three exam
# dates. Weeks 1 to 7 below are read off the eleven lecture decks themselves:
# the chapter each one covers, at the two-lectures-a-week pace that puts eleven
# of them in six weeks, with the Exam 1 review deck naming its own scope.
# Everything from week 8 on is marked PROJECTED, because it is inferred from
# what the course has left to cover and the objectives the syllabus does state,
# and no document in this repository says it.
#
# The estimate it replaces had the emphasis badly wrong, and in an instructive
# direction: it was written from the catalog description, which lists
# "transient analysis, application of Laplace transforms, Bode plots, and
# network principles" and mentions neither second-order circuits nor the
# chapter 12 machinery, both of which are half of the first exam.

id: 2026-fall
title: Fall 2026
startsOn: 2026-08-17
endsOn: 2026-12-11

courses:
  # From the syllabus, not estimated. Class weeks CW1-CW16 map onto term weeks
  # 1-16, and all three exams are cumulative.
  #
  # The `Sound` unit is deliberately absent: beats, the Doppler effect and
  # sound intensity are OpenStax Vol I Ch 17 and this syllabus stops at Ch 16.
  # Their knowledge components still exist and still carry items, so they are
  # reachable from the skill tree — they are simply never scheduled, which is
  # what keeps them out of the daily quest and the readiness list.
  - course: PHYS2335
    blocks:
      - fromWeek: 2
        toWeek: 3
        units: [Fluid Statics]
        note: Pressure vs depth, then Archimedes' principle
      - fromWeek: 3
        toWeek: 5
        units: [Heat and the Ideal Gas]
        note: Calorimetry, then the ideal gas law and rms speed
      - fromWeek: 6
        toWeek: 7
        units: [Thermodynamics]
        note: First law, heat engines, refrigerators and heat pumps
      - fromWeek: 7
        toWeek: 7
        units: [Fluid Statics, Heat and the Ideal Gas, Thermodynamics]
        note: Exam 1 on Wednesday 30 September — cumulative
      - fromWeek: 8
        toWeek: 9
        units: [Oscillations]
        note: Fall break falls in week 8
      - fromWeek: 9
        toWeek: 11
        units: [Mechanical Waves]
        note: Waves on strings, superposition, standing waves
      - fromWeek: 11
        toWeek: 13
        units: [Wave Optics]
        note: Two-slit, then multiple-slit, then single-slit diffraction
      - fromWeek: 12
        toWeek: 12
        units: [Oscillations, Mechanical Waves, Wave Optics]
        note: Exam 2 on Wednesday 4 November — cumulative
      - fromWeek: 14
        toWeek: 15
        units: [Geometric Optics]
        note: Reflection, refraction and total internal reflection
      - fromWeek: 16
        toWeek: 16
        units: [Wave Optics, Geometric Optics]
        note: Exam 3 on Monday 30 November — cumulative
      - fromWeek: 17
        toWeek: 17
        units: [Fluid Statics, Heat and the Ideal Gas, Thermodynamics, Oscillations, Mechanical Waves, Wave Optics, Geometric Optics]
        note: Final on Monday 7 December, 11:00-13:30 — comprehensive

    exams:
      - id: exam-1
        title: Exam 1
        on: 2026-09-30
        scope: Chapters 14, 1-3 — fluids, calorimetry, the ideal gas and the first law
        cumulative: true
        units: [Fluid Statics, Heat and the Ideal Gas, Thermodynamics]
      - id: exam-2
        title: Exam 2
        on: 2026-11-04
        cumulative: true
        units: [Fluid Statics, Heat and the Ideal Gas, Thermodynamics, Oscillations, Mechanical Waves, Wave Optics]
      - id: exam-3
        title: Exam 3
        on: 2026-11-30
        cumulative: true
        units: [Fluid Statics, Heat and the Ideal Gas, Thermodynamics, Oscillations, Mechanical Waves, Wave Optics, Geometric Optics]
      - id: final
        title: Final
        on: 2026-12-07
        minutes: 150
        scope: Comprehensive, 11:00-13:30
        cumulative: true
        units: [Fluid Statics, Heat and the Ideal Gas, Thermodynamics, Oscillations, Mechanical Waves, Wave Optics, Geometric Optics]

  # The most complete syllabus of the four: a day-by-day section list, so these
  # blocks are a direct reading rather than an inference. Class days map onto
  # term weeks exactly — day 1 is Thursday 20 August, in week 1.
  #
  # Four units are deliberately absent from every block. Combinatorics,
  # Relations, Recurrences and Boolean Algebra cover Rosen chapters 6, 9, 8 and
  # 12, and this syllabus reaches none of them; their components still carry
  # items and are still reachable from the skill tree, they simply never
  # compete for study time. Same treatment as PHYS 2335's Sound unit.
  - course: MATH2358
    blocks:
      - fromWeek: 1
        toWeek: 3
        units: [Logic and Proof]
        note: Rosen 1.1-1.5 then 1.7-1.8 — propositional and predicate logic, then proofs
      - fromWeek: 4
        toWeek: 4
        units: [Induction]
        note: Rosen 5.1 over two class days
      - fromWeek: 5
        toWeek: 6
        units: [Sets and Functions]
        note: Rosen 2.1-2.5 — sets, functions, sequences and summations, cardinality
      - fromWeek: 7
        toWeek: 7
        units: [Logic and Proof, Induction, Sets and Functions]
        note: Test 1 on Tuesday 29 September — 1.1-1.8, 5.1, 2.1-2.5
      - fromWeek: 7
        toWeek: 10
        units: [Number Theory]
        note: Rosen 4.1-4.5 — divisibility, bases, primes and GCD, congruences
      - fromWeek: 10
        toWeek: 12
        units: [Graphs]
        note: Rosen 10.1-10.5 — terminology, representation and isomorphism, connectivity
      - fromWeek: 13
        toWeek: 13
        units: [Number Theory, Graphs]
        note: Test 2 on Tuesday 10 November; 10.6 shortest paths follows on the Thursday
      - fromWeek: 14
        toWeek: 15
        units: [Trees]
        note: Rosen 11.1-11.4 — trees, traversal and spanning trees
      - fromWeek: 16
        toWeek: 16
        units: [Logic and Proof, Induction, Sets and Functions, Number Theory, Graphs, Trees]
        note: Review for the final on Tuesday 1 December
      - fromWeek: 17
        toWeek: 17
        units: [Logic and Proof, Induction, Sets and Functions, Number Theory, Graphs, Trees]
        note: Final on Tuesday 8 December, 11:00-13:30 — comprehensive

    exams:
      - id: test-1
        title: Test 1
        on: 2026-09-29
        scope: Rosen 1.1-1.8, 5.1 and 2.1-2.5
        units: [Logic and Proof, Induction, Sets and Functions]
      - id: test-2
        title: Test 2
        on: 2026-11-10
        scope: Rosen 4.1-4.5 and 10.1-10.5
        units: [Number Theory, Graphs]
      - id: final
        title: Final
        on: 2026-12-08
        minutes: 150
        scope: Comprehensive, 11:00-13:30
        cumulative: true
        units: [Logic and Proof, Induction, Sets and Functions, Number Theory, Graphs, Trees]

  # Circuits II spends its first three lectures re-teaching Circuits I, so that
  # material is genuinely live again rather than merely assumed. Chapter 7 in
  # particular is not revision: the Exam 1 review deck names "first and second
  # order circuits" in the same breath, so the first-order response is examined
  # on Monday alongside chapter 8, and it lives in EE 2300's graph.
  - course: EE2300
    blocks:
      - fromWeek: 1
        toWeek: 2
        units: [Fundamentals, Circuit Laws, Network Theorems]
        note: Lectures 2 and 3 revisit Nilsson chapters 3 and 4
      - fromWeek: 3
        toWeek: 3
        units: [Energy Storage and Transients]
        note: Lecture 4 re-teaches the first-order RL and RC response, chapter 7
      - fromWeek: 6
        toWeek: 7
        units: [Energy Storage and Transients]
        note: First-order response is named on the Exam 1 review deck

  # Weeks 1-7 are read off the lecture decks; week 8 onward is PROJECTED.
  # Note the teaching order: the Laplace transform arrives in lecture 7, before
  # chapter 8 rather than after it, so second-order circuits are taught with the
  # s-domain already available. The chapter numbers are not the running order.
  - course: EE3300
    blocks:
      - fromWeek: 3
        toWeek: 3
        units: [Sinusoidal Steady State]
        note: Lecture 5 — chapter 9, the phasor transform
      - fromWeek: 4
        toWeek: 4
        units: [AC Power, The s-Domain]
        note: Lecture 6 is chapter 10; lecture 7 opens the Laplace transform
      - fromWeek: 5
        toWeek: 5
        units: [Second-Order Circuits]
        note: Lectures 8 and 9 — chapter 8, natural and step responses of RLC circuits
      - fromWeek: 6
        toWeek: 6
        units: [The s-Domain, Second-Order Circuits, Sinusoidal Steady State, AC Power]
        note: Lecture 10 is chapter 13; lecture 11 is the Exam 1 review
      - fromWeek: 7
        toWeek: 7
        units: [Second-Order Circuits, Sinusoidal Steady State, AC Power, The s-Domain]
        note: Exam 1 moved to Monday 28 September — chapters 8, 9, 10 and 12
      - fromWeek: 8
        toWeek: 9
        units: [The s-Domain]
        note: PROJECTED — chapter 13 continues after the exam
      - fromWeek: 10
        toWeek: 11
        units: [Frequency Response]
        note: PROJECTED — the syllabus names straight-line Bode approximation as an objective
      - fromWeek: 12
        toWeek: 12
        units: [The s-Domain, Frequency Response]
        note: Exam 2 on Thursday 5 November
      - fromWeek: 13
        toWeek: 14
        units: [Coupled Circuits]
        note: PROJECTED — not yet lectured
      - fromWeek: 15
        toWeek: 16
        units: [Three-Phase]
        note: PROJECTED — not yet lectured
      - fromWeek: 17
        toWeek: 17
        units: [Sinusoidal Steady State, AC Power, Second-Order Circuits, The s-Domain, Frequency Response, Coupled Circuits, Three-Phase]
        note: Final on Tuesday 8 December, 08:00-10:30 — comprehensive

    exams:
      # The one exam in this term whose scope leaves its own course. The review
      # deck names "first and second order circuits" together, and the
      # first-order response is Nilsson chapter 7 — taught again in week 3 of
      # Circuits II, examined here, and owned by EE 2300's graph.
      - id: exam-1
        title: Exam 1
        on: 2026-09-28
        scope: Chapters 8, 9, 10 and 12, with the first-order response from chapter 7
        units:
          - Second-Order Circuits
          - Sinusoidal Steady State
          - AC Power
          - The s-Domain
          - EE2300:Energy Storage and Transients
      - id: exam-2
        title: Exam 2
        on: 2026-11-05
        scope: PROJECTED — chapter 13 and frequency response
        units: [The s-Domain, Frequency Response]
      - id: final
        title: Final
        on: 2026-12-08
        minutes: 150
        scope: Comprehensive, 08:00-10:30
        cumulative: true
        units: [Sinusoidal Steady State, AC Power, Second-Order Circuits, The s-Domain, Frequency Response, Coupled Circuits, Three-Phase]

