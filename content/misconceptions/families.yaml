  - { id: ode.initial-condition-ignored,      family: initial-conditions, title: "Constants never fitted to the initial conditions" }
  - { id: ode.particular-solution-omitted,    family: initial-conditions, title: "Homogeneous solution given for a driven system" }
  - { id: calculus.definite-integral-lower-limit-dropped, family: initial-conditions, title: "Definite integral evaluated at one limit only" }
  - { id: supernode.constraint-omitted,       family: initial-conditions, title: "Supernode constraint equation omitted" }

