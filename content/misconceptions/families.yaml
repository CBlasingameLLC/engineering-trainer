# Misconception families.
#
# The point of this file is the one claim no item can make about itself: that an
# error under one topic is the same mistake as an error under another. A sign
# dropped in a KVL loop and a sign dropped in a characteristic root are one
# habit, and nothing in EE 2300's pack or MATH 3323's pack is in a position to
# notice. Grouping them is what turns "you missed nine questions" into "you drop
# signs", which is the only version a learner can act on.
#
# Per-item feedback lives on the items, where it can name the actual number the
# learner wrote. Nothing here repeats it.

schemaVersion: '1.0.0'

families:
  - id: sign-convention-discipline
    title: Sign discipline
    competency: math-execution
    description: >-
      Losing or inverting a sign while carrying a quantity through a
      calculation. The single most portable error in the whole degree: it costs
      marks in circuits, calculus and differential equations identically, and
      it is never a gap in understanding — it is bookkeeping.

  - id: complex-quantity-discipline
    title: Complex quantity discipline
    competency: math-execution
    description: >-
      Treating a complex quantity as though it were a real one: adding
      reactances as magnitudes, dropping a conjugate, answering with a
      magnitude and no angle. Every one of them produces a plausible number,
      which is why they survive a self-check — the answer looks like an answer.
      They appear together across impedance, AC power and three-phase, which is
      what makes them one habit rather than three topics.

  - id: ratio-inversion
    title: Inverted ratios
    competency: math-execution
    description: >-
      Writing a ratio upside down. Dividers, Ohm's law, Cramer's rule and
      logarithmic decay all reduce to putting the right quantity on top, and
      the error looks different in each while being the same slip.

  - id: exponent-bookkeeping
    title: Exponent bookkeeping
    competency: math-execution
    description: >-
      Mishandling the exponent when differentiating or integrating a power.
      Purely mechanical, and directly under every energy, transient and
      stored-charge result in the circuits sequence.

  - id: initial-conditions
    title: Initial and boundary conditions
    competency: modeling
    description: >-
      Solving the general problem and then failing to pin it to the specific
      one. The differential equation, the definite integral and the charged
      capacitor all have a family of answers until a stated condition picks
      one, and skipping that step is invisible until the number is wrong.

  - id: network-topology
    title: Reading the topology
    competency: visual
    description: >-
      Misreading how a network is connected before any arithmetic starts.
      Series read as parallel, the wrong pair of nodes, the wrong equivalent
      resistance. No amount of correct algebra survives it.

  - id: source-handling
    title: Handling sources
    competency: strategy
    description: >-
      Treating a source incorrectly when a method demands something specific of
      it — suppressing the wrong way for a Thevenin resistance, ignoring a
      source inside a supermesh, or holding a dependent source's control
      variable fixed.

  - id: dynamic-response
    title: Shape of a dynamic response
    competency: concept
    description: >-
      Choosing the wrong form for how something evolves in time: a decay where
      there is a rise, an oscillation where there is none, or a regime
      classified from the wrong quantity. This is the family that connects
      RLC damping to the discriminant of a quadratic.

  - id: formula-substitution
    title: Substituting into a remembered formula
    competency: numeracy
    description: >-
      Recalling a result nearly correctly — a dropped factor of two, gains
      added where they multiply, a term averaged where it should be summed.
      The characteristic error of learning results instead of derivations.

  - id: system-solving
    title: Solving simultaneous systems
    competency: math-execution
    description: >-
      Errors in carrying a linear system to its solution, including reporting
      the wrong unknown at the end. Directly under every nodal and mesh
      analysis, which is why a weakness here reads as a circuits weakness.

  - id: boolean-transformation
    title: Transforming logical expressions
    competency: math-execution
    description: >-
      Rewriting an expression into an equivalent form and losing something on
      the way — a connective that should have swapped, a negation that never
      distributed, a simplification abandoned halfway. The same slip whether it
      is written as logic, as sets or as gates.

  - id: logical-form
    title: The shape of an argument
    competency: concept
    description: >-
      Confusing a statement with its converse or inverse, or an assumption with
      what has to be proved. These are not calculation errors; they are errors
      about what was being claimed, and they survive any amount of algebra
      practice.

  - id: counting-strategy
    title: Setting up a count
    competency: strategy
    description: >-
      Choosing the wrong counting model at the first step: multiplying where
      the cases are exclusive, ordering where order is irrelevant, or leaving an
      overlap counted twice. Everything after that first decision is arithmetic.

  - id: definition-precision
    title: Applying a definition exactly
    competency: concept
    description: >-
      Claiming a property that a definition does not quite grant, or missing one
      it does. Reflexive, surjective, Eulerian and the rest each have a precise
      test, and "nearly satisfies it" is not a category.

  - id: place-value-discipline
    title: Place value and encoding
    competency: numeracy
    description: >-
      Carrying digits between representations without re-weighting them, or
      reading an encoded pattern under the wrong convention. Runs under base
      conversion, BCD, minterm indexing and modular reduction alike.

  - id: absolute-scale-discipline
    title: Absolute scales and reference points
    competency: numeracy
    description: >-
      Substituting a quantity measured from a convenient zero where the physics
      requires one measured from a true zero. Celsius for kelvin is the common
      case and gauge pressure for absolute is the same slip; so is reading a
      decibel level as though it were an intensity. What makes it one habit
      rather than several is that the learner almost always knows the
      distinction and still substitutes the wrong number, because the wrong
      number is the one printed in the question. It survives a units check,
      which is why it needs naming: kelvin and celsius are both degrees of
      temperature, and only one of them starts where the physics does.

  - id: mechanism-attribution
    title: Attributing an effect to the right cause
    competency: concept
    description: >-
      Knowing that something happens and being wrong about why. This is the
      characteristic error of a process course, and it is invisible to every
      other kind of question: a learner who knows wet oxidation is faster, that
      EUV uses mirrors and that a purge gas is inert can answer a great deal
      correctly while holding the wrong mechanism for all three. It only
      surfaces when the question asks for the cause, and it matters because the
      mechanism is what transfers — a wrong one predicts nothing about the next
      process, and the plausible wrong causes are usually effects that are real
      but not responsible.

  - id: unit-conversion-discipline
    title: Combining quantities in unlike units
    competency: numeracy
    description: >-
      Putting two quantities into one expression without first putting them on
      the same scale: a gap in micrometres beside a wavelength in nanometres, a
      die area in square millimetres beside a density per square centimetre,
      a rate constant tabulated per hour and read as though it were per minute.
      Distinct from absolute-scale errors, where the zero is wrong rather than
      the magnitude, and distinct from a misremembered formula — the formula is
      right and the numbers put into it are not commensurate. It leaves a clean
      power-of-ten signature in the answer, which is what makes it worth
      naming separately.

  - id: controlled-variables
    title: Reasoning from a proportionality without holding the rest fixed
    competency: modeling
    description: >-
      Reading "X is proportional to Y" out of a relation with more than two
      variables, and applying it while a third one is moving. The ideal gas law
      is where this is cleanest — "P = nRT/V, so halving the volume doubles the
      pressure" is correct only at fixed n and T, and is confidently wrong in
      any process where gas escapes — but it is the same habit behind judging a
      fluid pressure from depth while the free surface is moving. What makes it
      worth its own family rather than filing under substitution is that the
      equation was used correctly: the error is in an unstated condition, not
      in the algebra, so checking the arithmetic finds nothing.

  - id: strategy-confidence
    title: Abandoning a determinate problem as underdetermined
    competency: strategy
    description: >-
      Concluding that there is not enough information when there is, usually
      because the missing quantity was going to cancel or was fixed by
      something outside the equation being stared at — a piston's force
      balance, a connected fluid at the same height. It is a strategy failure
      rather than a knowledge one, and it is invisible to any item that only
      offers numeric answers, which is why it needs a distractor that says so
      out loud.

  - id: state-and-sequence
    title: Tracking state through a sequence
    competency: modeling
    description: >-
      Losing the thread when the answer depends on what came before — a
      mistraced state machine, a recurrence with a dropped term, a counter sized
      from the wrong quantity. The errors that only appear once memory is
      involved.

