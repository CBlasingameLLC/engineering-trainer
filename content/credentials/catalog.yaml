# Extracurricular credential catalog
#
# Ratings are deliberate and arguable — that is the point. `signalStrength` is
# what a recruiter or interviewer reads into it for the stated track;
# `learningValue` is what you actually gain. They diverge sharply, and a catalog
# that merges them would recommend 300-hour web certificates to a semiconductor
# student because the hour count looks impressive.
#
# Every entry has a `checkedOn` date. Programmes change pricing, retire exams
# and withdraw student offers constantly.

schemaVersion: '1.0.0'
title: Engineering credentials for a Micro and Nano Systems track

credentials:
  # --- Highest value per hour -----------------------------------------------
  - id: mathworks.matlab-onramp
    name: MATLAB Onramp
    provider: MathWorks
    url: https://matlabacademy.mathworks.com/details/matlab-onramp/gettingstarted
    kind: completion-certificate
    cost:
      tier: free
      note: Free and open to anyone; a shareable certificate is issued on passing the end quiz.
    effortHours: 2
    signalStrength: 0.45
    learningValue: 0.35
    tracks:
      - { track: general-engineering, relevance: 1.0 }
      - { track: signal-processing, relevance: 0.9 }
      - { track: analog-mixed-signal, relevance: 0.7 }
    reinforcesKcs: [math3376.linear-systems]
    why: >-
      Two hours for a line on your resume that a large share of engineering job
      descriptions still ask for by name. Nothing else in this catalog has a
      comparable ratio of signal to time spent.
    caveat: >-
      It is genuinely introductory. It clears a checkbox and teaches syntax; it
      will not impress anyone who reads past the title.
    checkedOn: '2026-09-15'

  - id: mathworks.simulink-onramp
    name: Simulink Onramp
    provider: MathWorks
    url: https://matlabacademy.mathworks.com/details/simulink-onramp/simulink
    kind: completion-certificate
    cost: { tier: free }
    effortHours: 3
    signalStrength: 0.4
    learningValue: 0.4
    tracks:
      - { track: signal-processing, relevance: 0.9 }
      - { track: power-energy, relevance: 0.8 }
      - { track: embedded-firmware, relevance: 0.6 }
      - { track: general-engineering, relevance: 0.5 }
    reinforcesKcs: [ee2300.second-order-rlc, ee2300.first-order-step]
    why: >-
      Block-diagram modelling is how control and power systems are actually
      designed, and seeing an RLC transient as a simulation rather than an
      equation tends to make the damping regimes click.
    caveat: Same as MATLAB Onramp — introductory, and worth little on its own.
    checkedOn: '2026-09-15'

  - id: ti.precision-labs-opamps
    name: TI Precision Labs — Op Amps
    provider: Texas Instruments
    url: https://www.ti.com/video/series/precision-labs/ti-precision-labs-op-amps.html
    kind: completion-certificate
    cost:
      tier: free
      note: Free with a myTI account.
    effortHours: 12
    signalStrength: 0.75
    learningValue: 0.85
    tracks:
      - { track: analog-mixed-signal, relevance: 1.0 }
      - { track: semiconductor-vlsi, relevance: 0.6 }
      - { track: power-energy, relevance: 0.5 }
    reinforcesKcs:
      - ee2300.op-amp-ideal
      - ee2300.op-amp-inverting
      - ee2300.op-amp-summing
      - ee2300.op-amp-cascade
    why: >-
      The strongest free analog credential available, and unusually well
      regarded because it is vendor training on parts you will actually
      specify. It covers what a course omits — offset, noise, bandwidth,
      stability — which is precisely the gap between passing EE 2300 and being
      useful in an analog lab.
    caveat: >-
      No proctored assessment, so it proves exposure rather than competence.
      Its value shows up when you can discuss stability in an interview, not
      from the certificate itself.
    checkedOn: '2026-09-15'

  - id: github.foundations
    name: GitHub Foundations
    provider: GitHub
    url: https://education.github.com/experiences/foundations_certificate
    kind: proctored-exam
    cost:
      tier: free-for-students
      usd: 99
      note: >-
        Normally 99 USD; waived for students verified through GitHub Education.
        Voucher delivery has been intermittent through 2026 — many verified
        students report being unable to redeem it. A route via DataCamp in the
        Student Developer Pack has also been offered. Check current
        availability before planning around it.
    effortHours: 10
    signalStrength: 0.6
    learningValue: 0.55
    tracks:
      - { track: embedded-firmware, relevance: 0.9 }
      - { track: semiconductor-vlsi, relevance: 0.7 }
      - { track: general-engineering, relevance: 0.8 }
    why: >-
      A proctored exam, which puts it above the completion certificates here,
      and it closes a real and common gap: version control is assumed on every
      engineering team and taught in almost no EE curriculum. Verilog and
      firmware work both live in git.
    caveat: >-
      Entry level, and the free student voucher has been unreliable. Do not
      pay 99 USD for it — if the voucher is unavailable, the underlying skills
      are freely learnable and the certificate adds little.
    checkedOn: '2026-09-15'

  # --- Semiconductor and VLSI track ------------------------------------------
  - id: nptel.vlsi-design
    name: NPTEL VLSI Design and CMOS Subsystems
    provider: NPTEL / IIT (SWAYAM)
    url: https://nptel.ac.in/courses
    kind: assessed-certificate
    cost:
      tier: free
      note: >-
        Course material is free. The verified certificate requires a proctored
        in-person exam with a fee, typically around 1000 INR, and centres are
        mostly in India — treat the credential as impractical and the content
        as the point.
    effortHours: 40
    signalStrength: 0.4
    learningValue: 0.9
    tracks:
      - { track: semiconductor-vlsi, relevance: 1.0 }
      - { track: analog-mixed-signal, relevance: 0.5 }
    why: >-
      IIT-taught, genuinely rigorous, and directly on your concentration. As
      preparation for EE 4252 VLSI Design the content is excellent and free.
    caveat: >-
      The certificate is effectively out of reach outside India. Take it for
      the material, not the credential — and log it as coursework rather than
      as something to list.
    checkedOn: '2026-09-15'

  - id: tinytapeout.chip-design
    name: Tiny Tapeout
    provider: Tiny Tapeout / Efabless
    url: https://tinytapeout.com/
    kind: course-only
    cost:
      tier: paid
      usd: 100
      note: Roughly 100–350 USD per shuttle slot depending on tier and timing.
    effortHours: 30
    signalStrength: 0.9
    learningValue: 0.9
    tracks:
      - { track: semiconductor-vlsi, relevance: 1.0 }
      - { track: analog-mixed-signal, relevance: 0.5 }
    assumesKcs: [ee2300.op-amp-ideal]
    why: >-
      You design a small ASIC and it is actually fabricated on a real shuttle,
      and you receive the physical part. For a Micro and Nano Systems student
      this is the single most differentiating item in this catalog — almost no
      undergraduate can say they have taped out silicon.
    caveat: >-
      The only paid entry here, it needs digital logic and some HDL first, and
      shuttle slots are scheduled months apart. Plan it around EE 2320 and
      EE 4252 rather than attempting it cold.
    checkedOn: '2026-09-15'

  - id: nanohub.semiconductor
    name: nanoHUB-U semiconductor and nanoelectronics courses
    provider: Purdue / nanoHUB
    url: https://nanohub.org/courses
    kind: completion-certificate
    cost: { tier: free }
    effortHours: 25
    signalStrength: 0.45
    learningValue: 0.85
    tracks:
      - { track: semiconductor-vlsi, relevance: 1.0 }
    why: >-
      Purdue-run and squarely aimed at device physics and nanoelectronics,
      which is exactly the Micro and Nano Systems concentration. Good
      preparation for EE 3355 Solid State Devices and EE 4392.
    caveat: Academic rather than industry-facing; recognised in research circles more than by recruiters.
    checkedOn: '2026-09-15'

  # --- Computing and AI adjacency --------------------------------------------
  - id: nvidia.dli-accelerated-computing
    name: NVIDIA DLI — Fundamentals of Accelerated Computing with CUDA
    provider: NVIDIA Deep Learning Institute
    url: https://www.nvidia.com/en-us/training/online/
    kind: assessed-certificate
    cost:
      tier: free
      note: >-
        Around 21 self-paced DLI courses are free as of 2026 and several issue
        certificates; some instructor-led offerings remain paid. Verify the
        specific course is on the free list before starting.
    effortHours: 8
    signalStrength: 0.65
    learningValue: 0.7
    tracks:
      - { track: ai-hardware, relevance: 1.0 }
      - { track: semiconductor-vlsi, relevance: 0.6 }
      - { track: signal-processing, relevance: 0.6 }
    why: >-
      NVIDIA is a credible name on a hardware resume, and GPU architecture sits
      directly on the semiconductor side of AI. For anyone aiming at AI
      accelerator work this is the most relevant free credential available.
    caveat: >-
      Assumes working C. If CS 1428 is the extent of your programming, budget
      extra time for the language before the GPU concepts.
    checkedOn: '2026-09-15'

  - id: microsoft.azure-fundamentals
    name: Microsoft Certified — Azure Fundamentals (AZ-900)
    provider: Microsoft
    url: https://learn.microsoft.com/en-us/credentials/certifications/azure-fundamentals/
    kind: proctored-exam
    cost:
      tier: discounted-for-students
      usd: 99
      note: >-
        Learning content on Microsoft Learn is free. The exam is not: verified
        students get roughly 30% off fundamentals exams, and full vouchers turn
        up through Microsoft Virtual Training Days and events such as AI Skills
        Fest. Wait for a voucher rather than paying list price.
    effortHours: 12
    signalStrength: 0.45
    learningValue: 0.4
    tracks:
      - { track: general-engineering, relevance: 0.6 }
      - { track: embedded-firmware, relevance: 0.5 }
    why: >-
      Proctored, widely recognised, and cloud literacy is increasingly assumed
      even in hardware roles where test data and simulation runs live remotely.
    caveat: >-
      Weakly relevant to semiconductors specifically. Worth doing if a free
      voucher appears; not worth paying for on this track.
    checkedOn: '2026-09-15'

  - id: microsoft.ai-fundamentals
    name: Microsoft Certified — AI Fundamentals (AI-901)
    provider: Microsoft
    url: https://learn.microsoft.com/en-us/credentials/certifications/azure-ai-fundamentals/
    kind: proctored-exam
    cost:
      tier: discounted-for-students
      usd: 99
      note: >-
        Note the exam change — AI-900 retired on 30 June 2026 and AI-901
        replaces it on the same fundamentals track. Make sure any study guide
        you use targets AI-901.
    effortHours: 12
    signalStrength: 0.4
    learningValue: 0.4
    tracks:
      - { track: ai-hardware, relevance: 0.5 }
      - { track: general-engineering, relevance: 0.5 }
    why: Broad AI vocabulary, useful when hardware work touches ML workloads.
    caveat: >-
      Conceptual rather than technical, and thinner than the NVIDIA material
      for anyone who actually wants to work on AI hardware. Prefer DLI.
    checkedOn: '2026-09-15'

  # --- Software foundations --------------------------------------------------
  - id: freecodecamp.scientific-computing-python
    name: freeCodeCamp — Scientific Computing with Python
    provider: freeCodeCamp
    url: https://www.freecodecamp.org/learn/scientific-computing-with-python/
    kind: assessed-certificate
    cost: { tier: free }
    effortHours: 300
    signalStrength: 0.3
    learningValue: 0.65
    tracks:
      - { track: signal-processing, relevance: 0.6 }
      - { track: general-engineering, relevance: 0.5 }
    why: >-
      Of the freeCodeCamp tracks this is the one that transfers to engineering:
      Python is the default language for instrument control, measurement
      analysis and test automation, and the projects are built rather than
      watched.
    caveat: >-
      300 hours is an enormous commitment for a certificate recruiters do not
      weight heavily, and none of it is electrical engineering. If the goal is
      Python for lab work, the first 40 hours carry nearly all the value —
      consider stopping there and spending the rest on TI Precision Labs or
      Tiny Tapeout.
    checkedOn: '2026-09-15'

  - id: freecodecamp.responsive-web-design
    name: freeCodeCamp — Responsive Web Design
    provider: freeCodeCamp
    url: https://www.freecodecamp.org/learn/2022/responsive-web-design/
    kind: assessed-certificate
    cost: { tier: free }
    effortHours: 300
    signalStrength: 0.1
    learningValue: 0.5
    tracks:
      - { track: general-engineering, relevance: 0.15 }
    why: >-
      Free, project-based, and a genuine skill. Listed for completeness because
      it is the best-known freeCodeCamp track.
    caveat: >-
      Included so the ranking can be explicit about it rather than silently
      omitting it: 300 hours of web development does close to nothing for a
      Micro and Nano Systems resume. Almost any other entry here is a better
      use of the same time. Do it because you want to build websites, not to
      strengthen an engineering application.
    checkedOn: '2026-09-15'

  # --- Tools that show up in job descriptions --------------------------------
  - id: kicad.proficiency
    name: KiCad PCB design — self-directed project
    provider: KiCad (self-directed)
    url: https://www.kicad.org/help/learning-resources/
    kind: course-only
    cost: { tier: free }
    effortHours: 20
    signalStrength: 0.7
    learningValue: 0.8
    tracks:
      - { track: analog-mixed-signal, relevance: 0.9 }
      - { track: embedded-firmware, relevance: 0.9 }
      - { track: power-energy, relevance: 0.8 }
      - { track: rf-communications, relevance: 0.7 }
      - { track: semiconductor-vlsi, relevance: 0.5 }
    reinforcesKcs: [ee2300.series-parallel, ee2300.thevenin, ee2300.op-amp-inverting]
    why: >-
      Not a credential at all — a finished board is the artifact. A student who
      arrives with a schematic, a layout and a board that works has shown more
      than any certificate in this catalog, and interviewers will spend the
      conversation on it.
    caveat: >-
      Entirely self-directed, so it needs a real project and the discipline to
      finish one. Nothing validates it except the board working, which is both
      the weakness and the whole point.
    checkedOn: '2026-09-15'

  - id: ltspice.simulation
    name: LTspice simulation proficiency
    provider: Analog Devices (self-directed)
    url: https://www.analog.com/en/resources/design-tools-and-calculators/ltspice-simulator.html
    kind: course-only
    cost: { tier: free }
    effortHours: 10
    signalStrength: 0.5
    learningValue: 0.75
    tracks:
      - { track: analog-mixed-signal, relevance: 1.0 }
      - { track: power-energy, relevance: 0.8 }
      - { track: semiconductor-vlsi, relevance: 0.6 }
    reinforcesKcs:
      - ee2300.first-order-step
      - ee2300.second-order-rlc
      - ee2300.thevenin
      - ee2300.op-amp-inverting
    why: >-
      The industry standard for analog simulation and free. It also pairs
      directly with this trainer's circuit work: simulating a transient you
      solved by hand is the fastest way to find out whether you actually
      understood it.
    caveat: No credential exists. It appears on resumes as a listed skill, which carries less weight than a project.
    checkedOn: '2026-09-15'

  - id: ieee.student-membership
    name: IEEE student membership
    provider: IEEE
    url: https://www.ieee.org/membership/students/index.html
    kind: course-only
    cost:
      tier: paid
      usd: 32
      note: Around 32 USD per year for students; society memberships such as Solid-State Circuits cost extra.
    effortHours: 1
    signalStrength: 0.35
    learningValue: 0.5
    tracks:
      - { track: general-engineering, relevance: 0.8 }
      - { track: semiconductor-vlsi, relevance: 0.7 }
    why: >-
      Cheap, and the real return is access: Xplore papers, student branch
      activity, and conference discounts. The Solid-State Circuits Society in
      particular lines up with your concentration.
    caveat: >-
      Membership alone signals nothing — anyone can pay. It counts when paired
      with a paper read, a project, or a branch officer role.
    checkedOn: '2026-09-15'

  - id: coursera.student-catalog
    name: Coursera — university student access
    provider: Coursera
    url: https://www.coursera.org/
    kind: assessed-certificate
    cost:
      tier: free-for-students
      note: >-
        Access varies by institution. A limited catalog is common, meaning many
        individual courses and Professional Certificates remain paywalled even
        with student access. Check which specific courses your entitlement
        actually covers before planning a path around it.
    effortHours: 30
    signalStrength: 0.5
    learningValue: 0.7
    tracks:
      - { track: semiconductor-vlsi, relevance: 0.7 }
      - { track: signal-processing, relevance: 0.7 }
      - { track: general-engineering, relevance: 0.6 }
    why: >-
      Where a limited catalog does cover it, the UIUC VLSI CAD sequence and the
      Rice or Northwestern DSP courses are strong and directly on-track. A
      university-branded certificate also reads better than a vendor badge to
      non-technical screeners.
    caveat: >-
      Limited student access is the binding constraint. Confirm coverage first —
      it is common to plan a specialisation and then find the capstone is
      paywalled.
    checkedOn: '2026-09-15'

  - id: arm.education-embedded
    name: ARM Education — embedded systems courses
    provider: Arm
    url: https://www.arm.com/resources/education/online-courses
    kind: completion-certificate
    cost: { tier: free }
    effortHours: 20
    signalStrength: 0.55
    learningValue: 0.75
    tracks:
      - { track: embedded-firmware, relevance: 1.0 }
      - { track: semiconductor-vlsi, relevance: 0.5 }
    reinforcesKcs: [ee2300.ohms-law]
    why: >-
      Arm cores are in nearly everything you will touch as an embedded
      engineer, and the material maps closely onto EE 3320 Microprocessors.
      Vendor training on the dominant architecture carries weight.
    caveat: Completion-based rather than assessed, and narrower than a general embedded course.
    checkedOn: '2026-09-15'
