# PHYS 2335 — Waves and Heat (Texas State University, 2026 catalog)
#
# The name undersells it. The syllabus covers fluids, thermodynamics,
# oscillations, waves *and* optics, and the two ends of that list were missing
# from this file for a while because it was written from the course title
# rather than from the syllabus. Fluid statics is on Exam 1 and optics is most
# of Exams 2 and 3; neither is a wave and neither is heat.
#
# Two knowledge components carry a note saying they are off this syllabus.
# They are real physics from the same textbook and the term deliberately does
# not schedule them — see the Sound note below.
#
# Two courses in one, joined by a habit rather than a subject: both halves are
# about a quantity that is conserved or transported, and both are graded on
# whether the right conservation statement was written down before any algebra
# started. That is why the units share competencies so heavily — the modelling
# step is the same step.
#
# The cross-course edges here are unusually load-bearing, and they run into the
# maths rather than into the physics:
#
# - Simple harmonic motion *is* the undamped second-order ODE. A learner who
#   cannot solve x'' + omega^2 x = 0 does not have an oscillations problem, and
#   telling them to reread the oscillations chapter is the wrong remediation.
#   `math3323.second-order-ode` is therefore a strong parent, not a nominal one.
# - Work done by a gas is an integral of pressure over volume, and the two
#   processes students actually get wrong (isothermal and adiabatic) are wrong
#   because the integral is, not because the thermodynamics is.
# - Conduction toward ambient and every cooling curve is a first-order ODE with
#   an exponential solution, which is the same object as the RC transient in
#   EE 2300 seen in a different course.
#
# What cannot be expressed yet: PHYS 2325 Mechanics is not in the graph, so
# energy, momentum and Newton's second law have no KCs to point at. Several
# edges below would otherwise run there — the mass-spring system wants F = -kx,
# and calorimetry wants conservation of energy stated generally. Those edges are
# missing rather than wrong, and they are the first thing to add when Mechanics
# lands. Until then a diagnosis in this course can bottom out at the maths but
# not at the mechanics underneath it.

code: PHYS2335
title: Waves and Heat
institution: Texas State University
catalogYear: 2026
tier: 4
credits: 4

kcs:
  # --- Unit 1: Fluid Statics (OpenStax Vol I Ch 14, weeks 2-3) ---------------
  # First unit of the course and on Exam 1. Entirely closed-form: every result
  # below is one equation, and the errors are about which pressure and which
  # volume rather than about the algebra.
  - id: phys2335.fluid-pressure-depth
    title: Pressure, depth and density
    unit: Fluid Statics
    domain: physics
    competencies: [math-execution, concept]
    difficultyPrior: -1.2
    description: >-
      Pressure in a static fluid rises with depth as rho g h, and does not
      depend on the shape or the width of the container. The distinction that
      costs marks is gauge against absolute: the first is the rho g h term on
      its own and the second adds the atmosphere on top.

  - id: phys2335.manometer
    title: Manometers and immiscible columns
    unit: Fluid Statics
    domain: physics
    competencies: [modeling, math-execution]
    difficultyPrior: -0.4
    description: >-
      Two fluids that do not mix, balanced across a U-tube. The whole method is
      one sentence — pressure is equal at any two points at the same height in
      the same connected fluid — and every manometer problem is choosing that
      height well.
    prerequisites:
      - kc: phys2335.fluid-pressure-depth
        strength: 0.9

  - id: phys2335.pascal-principle
    title: Pascal's principle and hydraulics
    unit: Fluid Statics
    domain: physics
    competencies: [concept, math-execution]
    difficultyPrior: -0.8
    description: >-
      Pressure applied to an enclosed fluid is transmitted undiminished, so a
      small force on a small piston balances a large force on a large one. The
      force ratio goes as the *area* ratio, which is the square of the radius
      ratio — and that squaring is where the factor of four goes missing.
    prerequisites:
      - kc: phys2335.fluid-pressure-depth
        strength: 0.5

  - id: phys2335.buoyancy
    title: Archimedes' principle and buoyant force
    unit: Fluid Statics
    domain: physics
    competencies: [concept, math-execution]
    difficultyPrior: -0.6
    description: >-
      The buoyant force equals the weight of the fluid displaced, which depends
      on the fluid's density and the submerged volume and never on what the
      object is made of. Apparent weight is the true weight less that force.
    prerequisites:
      - kc: phys2335.fluid-pressure-depth
        strength: 0.6

  - id: phys2335.floating-equilibrium
    title: Floating, draft and average density
    unit: Fluid Statics
    domain: physics
    competencies: [modeling, math-execution]
    difficultyPrior: -0.2
    description: >-
      A floating body displaces its own weight, so the submerged fraction is
      the ratio of the two densities and nothing else. Draft, waterline and the
      lift of a balloon are all that one statement applied to a different
      shape.
    prerequisites:
      - kc: phys2335.buoyancy
        strength: 0.9

  # --- Unit 2: Oscillations -------------------------------------------------
  - id: phys2335.simple-harmonic-motion
    title: Simple harmonic motion
    unit: Oscillations
    domain: physics
    competencies: [concept, math-execution]
    difficultyPrior: -1.0
    description: >-
      Amplitude, angular frequency, period and phase; position, velocity and
      acceleration as functions of time. The defining property is that
      acceleration is proportional to displacement and opposite in sign, which
      is what makes every restoring force in the course the same problem.
    prerequisites:
      - kc: math3323.second-order-ode
        strength: 0.7
      - kc: math2471.derivative-basics
        strength: 0.4

  - id: phys2335.oscillator-systems
    title: Mass-spring and pendulum systems
    unit: Oscillations
    domain: physics
    competencies: [modeling, math-execution]
    difficultyPrior: -0.6
    description: >-
      Reading the angular frequency out of a physical system — sqrt(k/m) for a
      spring, sqrt(g/L) for a simple pendulum — and the energy exchange between
      kinetic and potential over a cycle. The small-angle approximation is what
      makes the pendulum an oscillator at all.
    prerequisites:
      - kc: phys2335.simple-harmonic-motion
        strength: 0.9

  - id: phys2335.damped-driven-oscillation
    title: Damping, driving and resonance
    unit: Oscillations
    domain: physics
    competencies: [concept, modeling]
    difficultyPrior: 0.4
    description: >-
      Underdamped, critically damped and overdamped regimes; the driven
      amplitude peak near the natural frequency and the quality factor that sets
      its sharpness. Same three regimes as a second-order RLC circuit, which is
      the point: it is one piece of mathematics wearing two subjects.
    prerequisites:
      - kc: phys2335.simple-harmonic-motion
        strength: 0.8
      - kc: math3323.second-order-ode
        strength: 0.6

  # --- Unit 2: Mechanical waves ---------------------------------------------
  - id: phys2335.wave-speed
    title: Wave speed, frequency and wavelength
    unit: Mechanical Waves
    domain: physics
    competencies: [math-execution, numeracy]
    difficultyPrior: -1.2
    description: >-
      v = f*lambda, and the medium properties that fix v — sqrt(T/mu) on a
      string, sqrt(B/rho) in a fluid. The consequence students miss is that the
      source sets the frequency and the medium sets the speed, so it is the
      wavelength that changes at a boundary.

  - id: phys2335.travelling-wave-function
    title: The travelling wave function
    unit: Mechanical Waves
    domain: physics
    competencies: [math-execution, visual]
    difficultyPrior: -0.4
    description: >-
      y(x,t) = A sin(kx - omega*t + phi): extracting amplitude, wave number,
      angular frequency, phase and direction of travel from the written form,
      and rebuilding the form from measurements.
    prerequisites:
      - kc: phys2335.wave-speed
        strength: 0.8
      - kc: phys2335.simple-harmonic-motion
        strength: 0.4

  - id: phys2335.superposition-interference
    title: Superposition and interference
    unit: Mechanical Waves
    domain: physics
    competencies: [concept, modeling]
    difficultyPrior: 0.1
    description: >-
      Path difference in wavelengths decides constructive from destructive.
      Phase difference and path difference are the same statement in different
      units, and converting between them is where the arithmetic goes wrong.
    prerequisites:
      - kc: phys2335.travelling-wave-function
        strength: 0.7

  - id: phys2335.standing-waves
    title: Standing waves and harmonics
    unit: Mechanical Waves
    domain: physics
    competencies: [modeling, visual]
    difficultyPrior: 0.3
    description: >-
      Resonant frequencies of a string fixed at both ends, an open pipe and a
      pipe closed at one end. The closed pipe supports only odd harmonics, which
      is the single most commonly dropped fact in the unit.
    prerequisites:
      - kc: phys2335.superposition-interference
        strength: 0.7
      - kc: phys2335.wave-speed
        strength: 0.6

  - id: phys2335.beats
    title: Beats
    unit: Sound
    domain: physics
    competencies: [concept, numeracy]
    difficultyPrior: -0.5
    description: >-
      NOT ON THE FALL 2026 SYLLABUS. This is OpenStax Vol I Ch 17, and the
      syllabus stops at Ch 16. It sits in its own `Sound` unit precisely so
      that it can be left off the term: the term joins the graph by unit name,
      so a note alone would have changed nothing and this one would have been
      false. The component and its items stay because the physics is real and
      a later course may want it; the term simply never schedules the unit, so
      the term view and the daily quest spend no study time on it.

      Two close frequencies superpose into an amplitude that pulses at their
      difference. The beat frequency is |f1 - f2|, not half of it — the envelope
      passes through a maximum twice per cycle of the half-difference term.
    prerequisites:
      - kc: phys2335.superposition-interference
        strength: 0.6

  - id: phys2335.sound-intensity
    title: Sound intensity and the decibel scale
    unit: Sound
    domain: physics
    competencies: [numeracy, math-execution]
    difficultyPrior: 0.0
    description: >-
      NOT ON THE FALL 2026 SYLLABUS. This is OpenStax Vol I Ch 17, and the
      syllabus stops at Ch 16. It sits in its own `Sound` unit precisely so
      that it can be left off the term: the term joins the graph by unit name,
      so a note alone would have changed nothing and this one would have been
      false. The component and its items stay because the physics is real and
      a later course may want it; the term simply never schedules the unit, so
      the term view and the daily quest spend no study time on it.

      Intensity falls as 1/r^2 from a point source, and the decibel is a
      logarithmic ratio against 1e-12 W/m^2. Doubling the intensity adds about
      3 dB; doubling the distance subtracts about 6.
    prerequisites:
      - kc: math2471.exponential-functions
        strength: 0.5

  - id: phys2335.doppler-effect
    title: The Doppler effect
    unit: Sound
    domain: physics
    competencies: [modeling, math-execution]
    difficultyPrior: 0.6
    description: >-
      NOT ON THE FALL 2026 SYLLABUS. This is OpenStax Vol I Ch 17, and the
      syllabus stops at Ch 16. It sits in its own `Sound` unit precisely so
      that it can be left off the term: the term joins the graph by unit name,
      so a note alone would have changed nothing and this one would have been
      false. The component and its items stay because the physics is real and
      a later course may want it; the term simply never schedules the unit, so
      the term view and the daily quest spend no study time on it.

      A moving source changes the wavelength; a moving observer changes the rate
      of arrival. They are different mechanisms with different algebra, and the
      sign convention that keeps them straight is the whole difficulty.
    prerequisites:
      - kc: phys2335.wave-speed
        strength: 0.7

  # --- Unit 3: Temperature, heat and the ideal gas --------------------------
  - id: phys2335.thermal-expansion
    title: Temperature and thermal expansion
    unit: Heat and the Ideal Gas
    domain: physics
    competencies: [math-execution, numeracy]
    difficultyPrior: -1.1
    description: >-
      Absolute and Celsius scales, and linear, area and volume expansion. Area
      and volume coefficients are 2*alpha and 3*alpha, which follows from the
      linear case rather than being three separate facts to memorise.

  - id: phys2335.calorimetry
    title: Heat capacity, latent heat and calorimetry
    unit: Heat and the Ideal Gas
    domain: physics
    competencies: [modeling, math-execution]
    difficultyPrior: -0.3
    description: >-
      Q = m*c*dT for a temperature change and Q = m*L for a phase change, and
      the energy balance that sets a mixture's final temperature. A problem that
      crosses a phase boundary needs both terms, and omitting the latent one is
      the error the unit exists to catch.
    prerequisites:
      - kc: phys2335.thermal-expansion
        strength: 0.3

  - id: phys2335.heat-transfer
    title: Conduction, convection and radiation
    unit: Heat and the Ideal Gas
    domain: physics
    competencies: [modeling, concept]
    difficultyPrior: 0.4
    description: >-
      Fourier conduction through a slab and through slabs in series, and
      Stefan-Boltzmann radiation. Slabs in series add thermal resistance exactly
      as resistors do, and net radiated power goes as T^4 - T_amb^4 in kelvin,
      never in celsius.
    prerequisites:
      - kc: phys2335.calorimetry
        strength: 0.5
      - kc: math3323.first-order-ode
        strength: 0.4

  - id: phys2335.ideal-gas-law
    title: The ideal gas law
    unit: Heat and the Ideal Gas
    domain: physics
    competencies: [math-execution, numeracy]
    difficultyPrior: -0.8
    description: >-
      PV = nRT, and the combined form relating two states of a fixed sample.
      Temperature is absolute and pressure is absolute; a gauge reading or a
      celsius temperature substituted directly is the characteristic failure.

  - id: phys2335.kinetic-theory
    title: Kinetic theory of gases
    unit: Heat and the Ideal Gas
    domain: physics
    competencies: [concept, modeling]
    difficultyPrior: 0.5
    description: >-
      Average translational kinetic energy is (3/2)kT per molecule regardless of
      species, so the rms speed goes as sqrt(T/M) — which is why hydrogen
      escapes an atmosphere and argon does not. Equipartition extends this to
      the molar heat capacities of monatomic and diatomic gases.
    prerequisites:
      - kc: phys2335.ideal-gas-law
        strength: 0.8

  # --- Unit 4: Laws of thermodynamics ---------------------------------------
  - id: phys2335.first-law
    title: The first law of thermodynamics
    unit: Thermodynamics
    domain: physics
    competencies: [concept, modeling]
    difficultyPrior: 0.2
    description: >-
      dU = Q - W with a stated sign convention, and internal energy as a state
      function while heat and work are not. Most first-law errors are sign
      errors about which way the energy went, not arithmetic ones.
    prerequisites:
      - kc: phys2335.ideal-gas-law
        strength: 0.6
      - kc: phys2335.calorimetry
        strength: 0.4

  - id: phys2335.pv-work
    title: Work done by a gas
    unit: Thermodynamics
    domain: physics
    competencies: [math-execution, visual]
    difficultyPrior: 0.7
    description: >-
      W = integral of P dV, which is the area under the path on a PV diagram —
      so the work depends on the path and not only on the endpoints. Isobaric
      work is a rectangle, isothermal work is n*R*T*ln(V2/V1), and isochoric
      work is zero.
    prerequisites:
      - kc: math2471.integration-basics
        strength: 0.7
      - kc: phys2335.first-law
        strength: 0.6

  - id: phys2335.thermodynamic-processes
    title: Isothermal, isobaric, isochoric and adiabatic processes
    unit: Thermodynamics
    domain: physics
    competencies: [modeling, strategy]
    difficultyPrior: 0.9
    description: >-
      Each process holds one quantity fixed and that fact alone determines which
      first-law term vanishes. Adiabatic means Q = 0 and P*V^gamma constant, not
      constant temperature — conflating the adiabatic and isothermal curves is
      the error that makes an otherwise correct cycle analysis wrong.
    prerequisites:
      - kc: phys2335.pv-work
        strength: 0.8
      - kc: phys2335.kinetic-theory
        strength: 0.4

  - id: phys2335.heat-engines
    title: Heat engines, refrigerators and Carnot efficiency
    unit: Thermodynamics
    domain: physics
    competencies: [strategy, numeracy]
    difficultyPrior: 1.0
    description: >-
      Thermal efficiency as net work over heat absorbed, the coefficient of
      performance for a refrigerator, and the Carnot bound 1 - Tc/Th as the
      ceiling no cycle beats. Claimed efficiencies above it are the sharpest
      second-law question available.
    prerequisites:
      - kc: phys2335.thermodynamic-processes
        strength: 0.8

  - id: phys2335.entropy
    title: Entropy and the second law
    unit: Thermodynamics
    domain: physics
    competencies: [concept, math-execution]
    difficultyPrior: 1.1
    description: >-
      dS = integral of dQ/T for a reversible path, entropy as a state function
      evaluated along any convenient path, and the total entropy of an isolated
      system never decreasing. A reversible process has zero total entropy
      change, which is the statement that makes Carnot the bound.
    prerequisites:
      - kc: phys2335.heat-engines
        strength: 0.7
      - kc: math2471.integration-basics
        strength: 0.5

  # --- Unit 5: Wave Optics (OpenStax Vol III Ch 3-4, weeks 11-13) -----------
  # Physically continuous with the interference already covered under waves —
  # the superposition is the same superposition — but the course treats it as
  # its own block and examines it separately, so it is its own unit here.
  #
  # The trap that defines this unit is that the two headline equations look
  # identical and mean opposite things: d sin(theta) = m lambda locates the
  # *maxima* of a two-slit pattern, and a sin(theta) = m lambda locates the
  # *minima* of a single-slit one. A learner who has memorised one formula
  # answers the other question confidently and wrongly.
  - id: phys2335.two-slit-interference
    title: Two-slit interference
    unit: Wave Optics
    domain: physics
    competencies: [modeling, math-execution]
    difficultyPrior: 0.1
    description: >-
      Path difference between two coherent sources, and the angles at which it
      is a whole number of wavelengths. Constructive where the difference is
      m lambda, destructive at the half-integers, and fringe spacing on a
      distant screen follows from the small-angle form.
    prerequisites:
      - kc: phys2335.superposition-interference
        strength: 0.8
      - kc: phys2335.travelling-wave-function
        strength: 0.3

  - id: phys2335.multiple-slit-grating
    title: Multiple slits and diffraction gratings
    unit: Wave Optics
    domain: physics
    competencies: [math-execution, concept]
    difficultyPrior: 0.35
    description: >-
      The same condition as two slits, applied to many. More slits do not move
      the maxima; they sharpen them, which is what makes a grating a
      measurement instrument rather than a demonstration. Slit spacing is
      usually quoted as lines per millimetre and has to be inverted first.
    prerequisites:
      - kc: phys2335.two-slit-interference
        strength: 0.9

  - id: phys2335.single-slit-diffraction
    title: Single-slit diffraction
    unit: Wave Optics
    domain: physics
    competencies: [modeling, math-execution]
    difficultyPrior: 0.4
    description: >-
      One slit of finite width, where a sin(theta) = m lambda gives the
      *minima* rather than the maxima, and m = 0 is excluded because it is the
      central bright fringe. Getting this backwards is the characteristic error
      of the unit and produces an answer that is dimensionally perfect.
    prerequisites:
      - kc: phys2335.two-slit-interference
        strength: 0.6

  # --- Unit 6: Geometric Optics (OpenStax Vol III Ch 2, weeks 14-15) --------
  - id: phys2335.reflection-refraction
    title: Reflection, refraction and Snell's law
    unit: Geometric Optics
    domain: physics
    competencies: [concept, math-execution]
    difficultyPrior: -0.3
    description: >-
      Light bends toward the normal entering a denser medium and away leaving
      it, by n1 sin(theta1) = n2 sin(theta2). Angles are measured from the
      normal and not from the surface, which is the first thing to check when
      an answer looks like its own complement.

  - id: phys2335.total-internal-reflection
    title: Total internal reflection and the critical angle
    unit: Geometric Optics
    domain: physics
    competencies: [concept, math-execution]
    difficultyPrior: 0.15
    description: >-
      Beyond the critical angle no light is transmitted at all. It exists only
      going from the denser medium to the less dense one, which is half the
      content of the idea: sin(theta_c) = n2/n1 has no solution the other way
      round, and an arcsine of something greater than one is the physics saying
      so rather than a calculator error.
    prerequisites:
      - kc: phys2335.reflection-refraction
        strength: 0.9
