# EE 3300 — Circuits II (Texas State University, 2026 catalog)
#
# The junior course Circuits I exists to prepare for, which makes it the first
# place in this curriculum where the graph is doing forward work rather than
# looking backwards: every gap here has a named parent in EE 2300 or in the
# calculus sequence, and a weakness in phasor analysis that is really a weakness
# in complex arithmetic or in nodal analysis is exactly the diagnosis the
# cross-course edges exist to make.
#
# Two dependencies are worth stating explicitly because they are the ones
# students are surprised by. Impedance is not a new idea, it is the capacitor
# and inductor i-v relations written for one frequency — so the edge runs from
# `ee2300.capacitor-iv`, and a learner who never really believed i = C dv/dt
# will fail impedance for that reason rather than for an AC one. And resonance
# is the second-order RLC response seen in the frequency domain instead of the
# time domain, which is why `ee2300.second-order-rlc` is its parent: the damping
# regimes and the quality factor are the same fact twice.

code: EE3300
title: Circuits II
institution: Texas State University
catalogYear: 2026
tier: 2
credits: 3

kcs:
  # --- Unit 1: Sinusoidal steady state --------------------------------------
  - id: ee3300.sinusoids-phasors
    title: Sinusoids and the phasor transform
    unit: Sinusoidal Steady State
    domain: circuits
    competencies: [concept, math-execution]
    difficultyPrior: -0.8
    description: >-
      Amplitude, frequency and phase; converting a cosine to a phasor and back.
      The transform is only valid at one frequency, which is the constraint that
      every later misuse of it violates.
    prerequisites:
      - kc: math2471.exponential-functions
        strength: 0.5

  - id: ee3300.impedance-admittance
    title: Impedance and admittance
    unit: Sinusoidal Steady State
    domain: circuits
    competencies: [concept, math-execution]
    difficultyPrior: -0.4
    description: >-
      Z for R, L and C, and combining them in series and parallel. Not a new
      idea: it is the capacitor and inductor i-v relations evaluated at one
      frequency.
    prerequisites:
      - ee3300.sinusoids-phasors
      - kc: ee2300.capacitor-iv
        strength: 0.6
      - kc: ee2300.inductor-iv
        strength: 0.6
      - kc: ee2300.series-parallel
        strength: 0.5

  - id: ee3300.phasor-circuit-analysis
    title: Nodal and mesh analysis in the phasor domain
    unit: Sinusoidal Steady State
    domain: circuits
    competencies: [math-execution, strategy]
    difficultyPrior: 0.3
    description: >-
      The same KCL and KVL, over complex numbers. Nothing about the method
      changes, which is why a failure here is almost always arithmetic rather
      than circuits.
    prerequisites:
      - ee3300.impedance-admittance
      - kc: ee2300.nodal-analysis
        strength: 0.7
      - kc: ee2300.mesh-analysis
        strength: 0.6

  - id: ee3300.ac-thevenin
    title: Thevenin and Norton equivalents with complex impedance
    unit: Sinusoidal Steady State
    domain: circuits
    competencies: [strategy, math-execution]
    difficultyPrior: 0.5
    description: >-
      Source suppression and the equivalent seen at a port, with Z in place of
      R. The procedure is unchanged; the reactive part is what makes the
      resulting equivalent frequency-dependent.
    prerequisites:
      - ee3300.phasor-circuit-analysis
      - kc: ee2300.thevenin
        strength: 0.7

  # --- Unit 2: AC power -----------------------------------------------------
  - id: ee3300.rms-values
    title: RMS values of periodic waveforms
    unit: AC Power
    domain: circuits
    competencies: [math-execution, concept]
    difficultyPrior: -0.3
    description: >-
      The value of a DC source delivering the same average power. It is an
      integral, and the factor of root two for a sinusoid is a consequence
      rather than a definition.
    prerequisites:
      - ee3300.sinusoids-phasors
      - kc: math2471.integration-basics
        strength: 0.5

  - id: ee3300.complex-power
    title: Complex power, real power and reactive power
    unit: AC Power
    domain: circuits
    competencies: [concept, math-execution]
    difficultyPrior: 0.4
    description: >-
      S = P + jQ, the power triangle, and the conjugate in S = V I*. The
      conjugate is the single most-dropped operator in the unit.
    prerequisites:
      - ee3300.rms-values
      - ee3300.impedance-admittance

  - id: ee3300.power-factor-correction
    title: Power factor and its correction
    unit: AC Power
    domain: circuits
    competencies: [modeling, math-execution]
    difficultyPrior: 0.6
    description: >-
      Leading and lagging, and sizing the capacitor that moves a load's power
      factor without changing the real power it draws.
    prerequisites:
      - ee3300.complex-power

  - id: ee3300.max-power-transfer-ac
    title: Maximum power transfer and the conjugate match
    unit: AC Power
    domain: circuits
    competencies: [concept, strategy]
    difficultyPrior: 0.5
    description: >-
      The load that extracts the most power is the conjugate of the source
      impedance, not a copy of it — the reactances must cancel.
    prerequisites:
      - ee3300.ac-thevenin
      - ee3300.complex-power
      - kc: ee2300.max-power-transfer
        strength: 0.6

  # --- Unit 3: Second-order circuits ----------------------------------------
  # Nilsson chapter 8, taught across two lectures and the lead topic on the
  # first exam. It sits in this course rather than only in Circuits I because
  # EE 3300 re-teaches it as its own block and examines it: `ee2300.second-order-rlc`
  # is its parent, not its substitute. The split below follows the analysis
  # method the lectures actually state — parameters, then classification, then
  # roots, then coefficients — because a learner who can compute alpha and
  # omega-0 and still cannot place the response in a damping regime has a
  # different problem from one who cannot solve for A1 and A2, and a single
  # "second-order response" KC reports them identically.
  - id: ee3300.rlc-damping-parameters
    title: Neper and resonant radian frequencies
    unit: Second-Order Circuits
    domain: circuits
    competencies: [math-execution, concept]
    difficultyPrior: -0.2
    description: >-
      The damping coefficient alpha and the resonant radian frequency omega-0.
      Alpha is 1/(2RC) for a parallel RLC circuit and R/(2L) for a series one;
      omega-0 is 1/sqrt(LC) for both. Reaching for the wrong alpha is the single
      most common way an otherwise correct second-order solution goes wrong,
      because nothing downstream of it looks unusual.
    prerequisites:
      - kc: ee2300.second-order-rlc
        strength: 0.7
      - kc: ee2300.capacitor-iv
        strength: 0.4
      - kc: ee2300.inductor-iv
        strength: 0.4

  - id: ee3300.rlc-damping-classification
    title: Classifying the damping regime
    unit: Second-Order Circuits
    domain: circuits
    competencies: [concept, numeracy]
    difficultyPrior: 0.0
    description: >-
      Comparing alpha squared against omega-0 squared to decide overdamped,
      underdamped or critically damped, and inverting that comparison to find
      the resistance that makes a given LC pair critically damped.
    prerequisites:
      - ee3300.rlc-damping-parameters

  - id: ee3300.rlc-characteristic-roots
    title: Characteristic roots and the damped frequency
    unit: Second-Order Circuits
    domain: circuits
    competencies: [math-execution]
    difficultyPrior: 0.2
    description: >-
      Solving s^2 + 2*alpha*s + omega-0^2 = 0 for s1 and s2, and the damped
      radian frequency omega-d = sqrt(omega-0^2 - alpha^2) in the underdamped
      case. The roots are real and distinct, complex conjugate, or real and
      repeated exactly as the classification says.
    prerequisites:
      - ee3300.rlc-damping-classification
      - kc: math3323.second-order-ode
        strength: 0.7

  - id: ee3300.rlc-natural-response
    title: Natural response of series and parallel RLC circuits
    unit: Second-Order Circuits
    domain: circuits
    competencies: [math-execution, modeling]
    difficultyPrior: 0.6
    description: >-
      Solving for the response coefficients from the initial value and the
      initial derivative. The derivative condition is the one that gets skipped:
      it comes from the element i-v relation at t = 0, not from the response
      form, and a solution that fits only the initial value fits infinitely many
      circuits.
    prerequisites:
      - ee3300.rlc-characteristic-roots
      - kc: ee2300.first-order-natural
        strength: 0.4

  - id: ee3300.rlc-step-response
    title: Step response of series and parallel RLC circuits
    unit: Second-Order Circuits
    domain: circuits
    competencies: [math-execution, strategy]
    difficultyPrior: 0.8
    description: >-
      The same three response forms displaced by a final value. The primed
      coefficients are fitted to the transient part alone, so subtracting the
      final value before applying the initial conditions is the step that
      separates a correct step response from a correct natural one.
    prerequisites:
      - ee3300.rlc-natural-response
      - kc: ee2300.first-order-step
        strength: 0.5

  # --- Unit 4: Frequency response -------------------------------------------
  - id: ee3300.transfer-functions
    title: Transfer functions and frequency response
    unit: Frequency Response
    domain: circuits
    competencies: [modeling, math-execution]
    difficultyPrior: 0.4
    description: >-
      H(jw) as a ratio of phasors, and its magnitude and phase as functions of
      frequency.
    prerequisites:
      - ee3300.impedance-admittance

  - id: ee3300.passive-filters
    title: First-order passive filters and cutoff frequency
    unit: Frequency Response
    domain: circuits
    competencies: [modeling, concept]
    difficultyPrior: 0.2
    description: >-
      RC and RL low-pass and high-pass sections, the half-power point, and which
      element the output is taken across.
    prerequisites:
      - ee3300.transfer-functions
      - kc: ee2300.first-order-step
        strength: 0.4

  - id: ee3300.bode-plots
    title: Bode magnitude and phase plots
    unit: Frequency Response
    domain: circuits
    competencies: [visual, concept]
    difficultyPrior: 0.6
    description: >-
      Asymptotic slopes in decades, corner frequencies, and the decibel scale.
    prerequisites:
      - ee3300.transfer-functions

  - id: ee3300.series-resonance
    title: Series resonance
    unit: Frequency Response
    domain: circuits
    competencies: [concept, math-execution]
    difficultyPrior: 0.5
    description: >-
      The frequency at which the reactances cancel, where a series RLC looks
      purely resistive and the current peaks.
    prerequisites:
      - ee3300.impedance-admittance
      - kc: ee2300.second-order-rlc
        strength: 0.6

  - id: ee3300.parallel-resonance
    title: Parallel resonance
    unit: Frequency Response
    domain: circuits
    competencies: [concept, math-execution]
    difficultyPrior: 0.7
    description: >-
      The dual: impedance peaks rather than current, and the quality factor
      inverts relative to the series case.
    prerequisites:
      - ee3300.series-resonance

  - id: ee3300.quality-factor-bandwidth
    title: Quality factor, bandwidth and selectivity
    unit: Frequency Response
    domain: circuits
    competencies: [concept, math-execution]
    difficultyPrior: 0.7
    description: >-
      Q as the ratio of resonant frequency to bandwidth, and as a ratio of
      stored to dissipated energy. The two definitions agree, and seeing why is
      the point.
    prerequisites:
      - ee3300.series-resonance

  # --- Unit 5: Coupled circuits and three-phase -----------------------------
  - id: ee3300.mutual-inductance
    title: Mutual inductance and the dot convention
    unit: Coupled Circuits
    domain: circuits
    competencies: [concept, visual]
    difficultyPrior: 0.6
    description: >-
      Coupling coefficient, induced voltage in the second coil, and the sign the
      dots decide. The dots are the whole content of the topic.
    prerequisites:
      - ee3300.phasor-circuit-analysis
      - kc: ee2300.inductor-iv
        strength: 0.5

  - id: ee3300.ideal-transformer
    title: Ideal transformers and impedance reflection
    unit: Coupled Circuits
    domain: circuits
    competencies: [modeling, math-execution]
    difficultyPrior: 0.5
    description: >-
      Turns ratio on voltage and current, and the square of it on impedance
      seen through the transformer.
    prerequisites:
      - ee3300.mutual-inductance

  - id: ee3300.three-phase-wye-delta
    title: Balanced three-phase wye and delta systems
    unit: Three-Phase
    domain: circuits
    competencies: [modeling, math-execution]
    difficultyPrior: 0.6
    description: >-
      Line and phase quantities and the root-three relations between them, in
      both connections.
    prerequisites:
      - ee3300.phasor-circuit-analysis
      - kc: ee2300.delta-wye
        strength: 0.5

  - id: ee3300.three-phase-power
    title: Power in balanced three-phase systems
    unit: Three-Phase
    domain: circuits
    competencies: [math-execution, modeling]
    difficultyPrior: 0.7
    description: >-
      Total real power as root-three times line voltage times line current times
      the power factor, and why the angle in it is the phase angle rather than
      the line one.
    prerequisites:
      - ee3300.three-phase-wye-delta
      - ee3300.complex-power

  # --- Unit 6: The s-domain -------------------------------------------------
  # Nilsson chapters 12 and 13, two full lectures, and examined on all three
  # exams. This unit was previously a single KC called "circuit analysis in the
  # s-domain" whose only generator asked for the time constant of a first-order
  # RL pole — so a learner could answer every item in it without meeting a
  # transform pair, a partial fraction or a value theorem, and be reported
  # proficient in the s-domain for it. The split below is chapter 12's own
  # structure: the transform, the singularity functions, the operational
  # properties, the three partial-fraction cases the lectures treat separately,
  # and the value theorems used to check a result before inverting it.
  - id: ee3300.laplace-definition-pairs
    title: The Laplace transform and its standard pairs
    unit: The s-Domain
    domain: circuits
    competencies: [math-execution, concept]
    difficultyPrior: 0.0
    description: >-
      The defining integral, and the table of pairs that replaces evaluating it.
      Both directions: the transform of an exponential, a ramp or a damped
      sinusoid, and the function a simple F(s) came from.
    prerequisites:
      - kc: math2471.integration-basics
        strength: 0.6
      - kc: math2471.exponential-functions
        strength: 0.5

  - id: ee3300.step-impulse-functions
    title: Step and impulse functions
    unit: The s-Domain
    domain: circuits
    competencies: [concept, modeling]
    difficultyPrior: -0.2
    description: >-
      The unit step and its shifts, a pulse written as a sum of steps, and the
      impulse as the step's derivative. The sifting property is what makes the
      impulse usable: integrating a function against it samples that function at
      one instant rather than accumulating anything.
    prerequisites:
      - kc: math2471.integration-basics
        strength: 0.4

  - id: ee3300.laplace-operational-properties
    title: Operational properties of the transform
    unit: The s-Domain
    domain: circuits
    competencies: [math-execution]
    difficultyPrior: 0.3
    description: >-
      Linearity, translation in time and in frequency, differentiation and
      integration, and scaling. Time shift multiplies the transform by an
      exponential in s; frequency shift displaces s in the transform. They are
      easy to swap and the swap produces a well-formed wrong answer.
    prerequisites:
      - ee3300.laplace-definition-pairs
      - ee3300.step-impulse-functions
      - kc: math2471.derivative-basics
        strength: 0.5

  - id: ee3300.pfe-distinct-poles
    title: Partial fractions with distinct real poles
    unit: The s-Domain
    domain: circuits
    competencies: [math-execution]
    difficultyPrior: 0.3
    description: >-
      Residues at simple real poles by covering up the factor and evaluating the
      rest at the pole. The base case the other two build on.
    prerequisites:
      - ee3300.laplace-definition-pairs

  - id: ee3300.pfe-repeated-poles
    title: Partial fractions with repeated real poles
    unit: The s-Domain
    domain: circuits
    competencies: [math-execution, strategy]
    difficultyPrior: 0.7
    description: >-
      A pole of multiplicity n needs n terms, and every coefficient below the
      highest power requires differentiating before evaluating. Writing one term
      per distinct factor is the characteristic error and it leaves the identity
      unsatisfiable rather than merely inaccurate.
    prerequisites:
      - ee3300.pfe-distinct-poles

  - id: ee3300.pfe-complex-poles
    title: Partial fractions with complex conjugate poles
    unit: The s-Domain
    domain: circuits
    competencies: [math-execution, numeracy]
    difficultyPrior: 0.8
    description: >-
      Conjugate poles give conjugate residues, so only one has to be computed.
      In the time domain the pair collapses to a single damped sinusoid whose
      amplitude is twice the residue magnitude and whose phase is its angle.
    prerequisites:
      - ee3300.pfe-distinct-poles
      - kc: ee3300.sinusoids-phasors
        strength: 0.4

  - id: ee3300.initial-final-value
    title: The initial- and final-value theorems
    unit: The s-Domain
    domain: circuits
    competencies: [concept, strategy]
    difficultyPrior: 0.2
    description: >-
      Reading f(0+) and f(infinity) off F(s) without inverting it, which is how
      an s-domain result gets checked before the algebra that follows it. Both
      have conditions: the final-value theorem says nothing at all unless every
      pole of sF(s) is in the left half plane, so applying it to an undamped
      oscillation returns a confident number for a limit that does not exist.
    prerequisites:
      - ee3300.laplace-definition-pairs

  - id: ee3300.s-domain-elements
    title: Circuit elements in the s-domain
    unit: The s-Domain
    domain: circuits
    competencies: [modeling, concept]
    difficultyPrior: 0.4
    description: >-
      R, sL and 1/(sC), and the initial conditions that come with them as an
      independent source in series or in parallel. Dropping that source is what
      turns a transient problem into a steady-state one without any warning.
    prerequisites:
      - ee3300.laplace-definition-pairs
      - kc: ee3300.impedance-admittance
        strength: 0.6
      - kc: ee2300.capacitor-iv
        strength: 0.4
      - kc: ee2300.inductor-iv
        strength: 0.4

  - id: ee3300.laplace-circuit-analysis
    title: Circuit analysis in the s-domain
    unit: The s-Domain
    domain: circuits
    competencies: [math-execution, strategy]
    difficultyPrior: 0.8
    description: >-
      Impedances in s, initial conditions as sources, and solving a transient by
      algebra instead of by differential equation.
    prerequisites:
      - ee3300.s-domain-elements
      - ee3300.pfe-distinct-poles
      - ee3300.initial-final-value
      - kc: math3323.second-order-ode
        strength: 0.7
      - kc: math3323.first-order-ode
        strength: 0.5
