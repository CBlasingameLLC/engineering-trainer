# MATH 2358 — Discrete Mathematics (Texas State University, 2026 catalog)
#
# On the computer science pathway rather than the EE one, and included anyway
# because the overlap with EE 2320 is the point. Propositional logic, De Morgan
# and Boolean algebra are the same mathematics a digital logic course applies to
# gates, and a student who has met both has two chances to notice a gap in
# either. The cross-course edges declared in ee2320.yaml are what let a failure
# on one side be traced to the other.
#
# Scoped broadly on purpose: the whole syllabus, before narrowing against the
# actual textbook and quizzes.

code: MATH2358
title: Discrete Mathematics
institution: Texas State University
catalogYear: 2026
tier: 1
credits: 3

kcs:
  # --- Unit 1: Logic and proof ----------------------------------------------
  - id: math2358.propositional-logic
    title: Propositional logic and connectives
    unit: Logic and Proof
    domain: math
    competencies: [concept, math-execution]
    difficultyPrior: -1.4
    description: >-
      Negation, conjunction, disjunction, exclusive or, and building the truth
      table of a compound proposition. The foundation the rest of the course
      and every logic gate stand on.
    prerequisites: []

  - id: math2358.conditional-statements
    title: Conditionals, converse, inverse and contrapositive
    unit: Logic and Proof
    domain: math
    competencies: [concept, strategy]
    difficultyPrior: -0.6
    description: >-
      The implication p -> q, its three relatives, and which of them are
      logically equivalent to it. The contrapositive being equivalent while the
      converse is not is the single most reused fact in the course.
    prerequisites:
      - math2358.propositional-logic

  - id: math2358.logical-equivalence
    title: Logical equivalence and De Morgan's laws
    unit: Logic and Proof
    domain: math
    competencies: [math-execution, concept]
    difficultyPrior: -0.3
    description: >-
      Tautology, contradiction, and rewriting a proposition into an equivalent
      form. De Morgan appears here first and then again in sets, in Boolean
      algebra and in gate minimisation — it is one theorem wearing four
      notations.
    prerequisites:
      - math2358.propositional-logic

  - id: math2358.boolean-algebra
    title: Boolean algebra as an algebraic system
    unit: Boolean Algebra
    domain: math
    competencies: [math-execution, concept]
    difficultyPrior: 0.1
    description: >-
      The axioms, the duality principle, and simplifying an expression by
      algebraic manipulation rather than by table. The abstract structure that
      EE 2320 applies to hardware.
    prerequisites:
      - math2358.logical-equivalence

  - id: math2358.predicate-logic
    title: Predicates and quantifiers
    unit: Logic and Proof
    domain: math
    competencies: [concept, modeling]
    difficultyPrior: 0.4
    description: >-
      Universal and existential quantification, nested quantifiers, and
      negating a quantified statement. Order of nested quantifiers changes
      meaning and is where most of the marks go.
    prerequisites:
      - math2358.propositional-logic

  - id: math2358.proof-methods
    title: Direct proof, contraposition and contradiction
    unit: Logic and Proof
    domain: math
    competencies: [strategy, concept]
    difficultyPrior: 0.7
    description: >-
      Choosing a proof strategy and knowing what each one assumes and must
      establish. Recognising which method a statement invites is the skill;
      executing it is comparatively mechanical.
    prerequisites:
      - math2358.conditional-statements
      - math2358.predicate-logic

  # --- Unit 2: Sets, relations and functions --------------------------------
  - id: math2358.set-operations
    title: Set operations and membership
    unit: Sets and Functions
    domain: math
    competencies: [concept, visual]
    difficultyPrior: -1.2
    description: >-
      Union, intersection, complement, difference, subset and power set, with
      Venn diagrams and membership tables as the two ways of seeing them.
    prerequisites: []

  - id: math2358.set-identities
    title: Set identities and membership tables
    unit: Sets and Functions
    domain: math
    competencies: [math-execution, visual]
    difficultyPrior: -0.2
    description: >-
      Proving set identities by membership table or by algebraic manipulation.
      A membership table is a truth table with different labels, which is why
      the same widget serves both.
    prerequisites:
      - math2358.set-operations
      - kc: math2358.logical-equivalence
        strength: 0.7

  - id: math2358.cartesian-products
    title: Cartesian products and ordered pairs
    unit: Sets and Functions
    domain: math
    competencies: [concept, numeracy]
    difficultyPrior: -0.5
    prerequisites:
      - math2358.set-operations

  - id: math2358.relation-properties
    title: Properties of relations
    unit: Relations
    domain: math
    competencies: [concept, modeling]
    difficultyPrior: 0.3
    description: >-
      Reflexive, symmetric, antisymmetric and transitive, tested against a
      relation given as a set of pairs or as a matrix. Antisymmetric is not the
      negation of symmetric, and treating it as one is the standard error.
    prerequisites:
      - math2358.cartesian-products

  - id: math2358.equivalence-relations
    title: Equivalence relations and partitions
    unit: Relations
    domain: math
    competencies: [concept, strategy]
    difficultyPrior: 0.6
    description: >-
      The correspondence between an equivalence relation and a partition of its
      underlying set, and finding equivalence classes.
    prerequisites:
      - math2358.relation-properties

  - id: math2358.functions
    title: Injective, surjective and bijective functions
    unit: Sets and Functions
    domain: math
    competencies: [concept, math-execution]
    difficultyPrior: 0.2
    description: >-
      Classifying a function, composing functions, and when an inverse exists.
    prerequisites:
      - math2358.cartesian-products

  # --- Unit 3: Combinatorics ------------------------------------------------
  - id: math2358.counting-principles
    title: Product and sum rules
    unit: Combinatorics
    domain: math
    competencies: [strategy, numeracy]
    difficultyPrior: -1.0
    description: >-
      Deciding whether choices multiply or add. Nearly every counting error in
      the course is this decision made wrongly at the first step.
    prerequisites: []

  - id: math2358.permutations
    title: Permutations
    unit: Combinatorics
    domain: math
    competencies: [math-execution, numeracy]
    difficultyPrior: -0.4
    prerequisites:
      - math2358.counting-principles

  - id: math2358.combinations
    title: Combinations
    unit: Combinatorics
    domain: math
    competencies: [math-execution, strategy]
    difficultyPrior: 0.0
    description: >-
      C(n,k) and, more importantly, telling it apart from P(n,k). Whether order
      matters is the whole question.
    prerequisites:
      - math2358.permutations

  - id: math2358.pigeonhole
    title: The pigeonhole principle
    unit: Combinatorics
    domain: math
    competencies: [strategy, concept]
    difficultyPrior: 0.5
    prerequisites:
      - math2358.counting-principles

  - id: math2358.inclusion-exclusion
    title: Inclusion-exclusion
    unit: Combinatorics
    domain: math
    competencies: [math-execution, visual]
    difficultyPrior: 0.6
    prerequisites:
      - math2358.counting-principles
      - math2358.set-operations

  - id: math2358.binomial-theorem
    title: The binomial theorem and Pascal's identity
    unit: Combinatorics
    domain: math
    competencies: [math-execution, concept]
    difficultyPrior: 0.4
    prerequisites:
      - math2358.combinations

  # --- Unit 4: Induction, recursion, graphs ---------------------------------
  - id: math2358.mathematical-induction
    title: Mathematical induction
    unit: Induction
    domain: math
    competencies: [strategy, math-execution]
    difficultyPrior: 0.8
    description: >-
      Base case, inductive hypothesis, inductive step. Most failed inductions
      fail at the step where the hypothesis has to actually be used.
    prerequisites:
      - math2358.proof-methods

  - id: math2358.recurrence-relations
    title: Recurrence relations and closed forms
    unit: Recurrences
    domain: math
    competencies: [math-execution, modeling]
    difficultyPrior: 1.0
    description: >-
      Solving linear homogeneous recurrences by characteristic root. The same
      characteristic-equation method as a second-order ODE, over integers.
    prerequisites:
      - math2358.mathematical-induction

  - id: math2358.graph-basics
    title: Graphs, degree and the handshake theorem
    unit: Graphs
    domain: math
    competencies: [concept, visual]
    difficultyPrior: -0.3
    prerequisites:
      - math2358.cartesian-products

  - id: math2358.graph-connectivity
    title: Paths, connectivity, Euler and Hamilton
    unit: Graphs
    domain: math
    competencies: [concept, strategy, visual]
    difficultyPrior: 0.5
    description: >-
      Walks, paths and circuits, and the degree conditions that decide whether
      an Euler circuit exists. Euler has a clean criterion and Hamilton does
      not, which is itself the lesson.
    prerequisites:
      - math2358.graph-basics

  - id: math2358.trees
    title: Trees and their properties
    unit: Graphs
    domain: math
    competencies: [concept, visual]
    difficultyPrior: 0.3
    description: >-
      Edge and vertex counts, rooted trees, and traversals.
    prerequisites:
      - math2358.graph-connectivity

  # --- Unit 5: Number theory ------------------------------------------------
  - id: math2358.gcd-euclidean
    title: Divisibility and the Euclidean algorithm
    unit: Number Theory
    domain: math
    competencies: [math-execution, numeracy]
    difficultyPrior: -0.2
    prerequisites: []

  - id: math2358.modular-arithmetic
    title: Modular arithmetic and congruences
    unit: Number Theory
    domain: math
    competencies: [math-execution, concept]
    difficultyPrior: 0.2
    description: >-
      Congruence, modular addition and multiplication, and inverses. The same
      repeated-division-with-remainder that converts a number between bases.
    prerequisites:
      - math2358.gcd-euclidean

  # --- Sections the syllabus teaches that had no component ------------------
  # The graph was written from what a discrete maths course usually contains.
  # This one's syllabus carries a day-by-day section list, and against it nine
  # taught sections had nothing at all while ten components covered chapters
  # the course never reaches. The ten are still here and still carry items;
  # they simply live in units the term never schedules, so they stay reachable
  # from the skill tree without competing for study time.
  - id: math2358.sequences-summations
    title: Sequences and summations
    unit: Sets and Functions
    domain: math
    competencies: [math-execution, numeracy]
    difficultyPrior: -0.2
    description: >-
      Closed forms for arithmetic and geometric sums, and sequences defined by
      a recurrence evaluated term by term. Rosen 2.4, and on the first test.
      The limits are where this goes wrong: a sum from 0 to n has n + 1 terms,
      and the geometric closed form is written for exactly that range.
    prerequisites:
      - math2358.functions

  - id: math2358.cardinality
    title: Cardinality of sets
    unit: Sets and Functions
    domain: math
    competencies: [concept, strategy]
    difficultyPrior: 0.4
    description: >-
      Counting a finite set, and the harder claim that two infinite sets have
      the same size because a bijection exists between them. Rosen 2.5, and on
      the first test. Countable does not mean finite, and a proper subset of an
      infinite set can be the same size as the whole of it — which is the point
      at which intuition from finite sets stops being a guide.
    prerequisites:
      - math2358.functions
      - math2358.set-operations

  - id: math2358.integer-representations
    title: Integer representations and base conversion
    unit: Number Theory
    domain: math
    competencies: [math-execution, numeracy]
    difficultyPrior: 0.0
    description: >-
      Base-b expansions and converting between them. Rosen 4.2. The same skill
      EE 2320 exercises on binary and hexadecimal, stated for an arbitrary base.
    prerequisites:
      - math2358.modular-arithmetic

  - id: math2358.linear-congruences
    title: Solving linear congruences
    unit: Number Theory
    domain: math
    competencies: [math-execution]
    difficultyPrior: 0.5
    description: >-
      Inverses modulo m and the solutions of ax = b (mod m). Rosen 4.4. An
      inverse exists exactly when gcd(a, m) = 1, so the Euclidean algorithm is
      not a separate topic here but the thing that decides whether the problem
      has an answer at all.
    prerequisites:
      - math2358.modular-arithmetic
      - math2358.gcd-euclidean

  - id: math2358.graph-isomorphism
    title: Representing graphs and isomorphism
    unit: Graphs
    domain: math
    competencies: [concept, visual]
    difficultyPrior: 0.4
    description: >-
      Adjacency matrices and lists, and the invariants that decide isomorphism.
      Rosen 10.3, two class days. Matching invariants never prove two graphs
      isomorphic; a single mismatched invariant proves they are not, which is
      why the negative direction is the tractable one.
    prerequisites:
      - math2358.graph-basics

  - id: math2358.shortest-path
    title: Shortest-path problems
    unit: Graphs
    domain: math
    competencies: [math-execution, modeling]
    difficultyPrior: 0.5
    description: >-
      Dijkstra's algorithm on a weighted graph. Rosen 10.6, taught immediately
      after the second exam. The greedy step is only valid because the weights
      are non-negative.
    prerequisites:
      - math2358.graph-basics
      - math2358.graph-connectivity

  - id: math2358.tree-traversal
    title: Tree traversal and spanning trees
    unit: Trees
    domain: math
    competencies: [math-execution, visual]
    difficultyPrior: 0.3
    description: >-
      Preorder, inorder and postorder traversal, and spanning trees of a
      connected graph. Rosen 11.3 and 11.4. A spanning tree of an n-vertex
      connected graph always has exactly n - 1 edges, whatever the graph.
    prerequisites:
      - math2358.trees

